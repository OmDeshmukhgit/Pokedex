apiVersion: apps/v1
kind: Deployment

metadata:
  name: pokedex-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: pokedex
      tier: development

  template:
    metadata:
      labels:
        app: pokedex
        tier: development

    spec:
      containers:
      - name: pokedex
        image: ${DOCKER_USER}/pokedex:${IMAGE_TAG}
        ports:
        - containerPort: 80